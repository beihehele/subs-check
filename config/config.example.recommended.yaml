# 可选推荐配置片段（不是完整配置）
#
# 使用方法：按需把这些字段合并进你的 config.yaml；不要用本文件覆盖默认
# config.example.yaml 或线上配置，否则会丢失你自己的订阅、API Key 和凭据。
#
# 这里保留了此前内置在默认示例中的“开箱即用”推荐值，以及一批公开订阅示例。
# 第三方公开订阅可能随时失效、变更或包含不适合你的节点，请优先替换为你自己的订阅。

# 保留的成功节点数量与地区分配策略
success-limit: 20
selection:
  mode: hybrid
  sort: balanced
  preferred-regions: [HK, SG, JP, US]
  min-per-region: 2
  region-weights: {HK: 2, SG: 2, JP: 1, US: 1}
  history: true
  explore-slots: 2

# 测速与保留阈值
# speed-test-url: https://example.com/your-speed-test-file
min-speed: 1024
speed-retest: true

# 平台检测与历史节点保留
media-check: true
keep-days: 1

# 失效订阅自动跳过与抽检
dead-sub-days: 2
dead-sub-recheck-days: 7

# Github Proxy 示例（按需填写，结尾保留 /）
# github-proxy: "https://your-github-proxy.example/"
github-proxy: ""

# 远程订阅清单示例
sub-urls-remote:
  # - https://raw.githubusercontent.com/your-org/your-repo/main/sub-list.txt
  # - https://raw.githubusercontent.com/your-org/your-repo/main/sub-list.yaml

